<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HTML Cell Preview</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<script src="vendor/purify.min.js"></script>
<style>
  :root { color-scheme: light dark; --bg: #f3f3f3; --fg: #222; --muted: #666; --line: #d0d0d0; }
  @media (prefers-color-scheme: dark) { :root { --bg: #202020; --fg: #eee; --muted: #aaa; --line: #444; } }
  html, body { margin: 0; height: 100%; }
  body { display: flex; flex-direction: column; background: var(--bg); color: var(--fg);
         font: 13px "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif; }
  header { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  #address { font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  label { color: var(--muted); white-space: nowrap; }
  button { font: inherit; padding: 2px 10px; }
  #paste { display: none; height: 30%; margin: 8px; font: 12px ui-monospace, Menlo, Consolas, monospace; }
  #view { flex: 1; border: 0; width: 100%; background: #fff; }
  #status { padding: 4px 8px; color: var(--muted); border-top: 1px solid var(--line); }
</style>
</head>
<body>
<header>
  <span id="address">Select a cell</span>
  <label><input type="checkbox" id="remote"> Remote images</label>
  <button id="refresh" type="button">Refresh</button>
</header>
<textarea id="paste" placeholder="Not running in Excel. Paste HTML here to preview it."></textarea>
<!-- sandbox="" = no scripts, no forms, no popups, no top navigation, unique origin. -->
<iframe id="view" sandbox="" title="Rendered HTML"></iframe>
<div id="status"></div>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
let seq = 0;
let current = "";

// Links open nothing (the sandbox blocks popups) but keep their URL visible on hover.
DOMPurify.addHook("afterSanitizeAttributes", (node) => {
  if (node.hasAttribute("href")) {
    node.setAttribute("target", "_blank");
    node.setAttribute("title", node.getAttribute("href"));
  }
});

function buildDocument(html, allowRemote) {
  const clean = DOMPurify.sanitize(html, { WHOLE_DOCUMENT: true });
  const remote = allowRemote ? " https:" : "";
  // Defence in depth: even if something survived sanitising, nothing can load or run.
  const csp = "default-src 'none'; style-src 'unsafe-inline'; " +
              `img-src data:${remote}; font-src data:${remote}; media-src data:${remote}`;
  const head = `<meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="${csp}">`;
  return clean.replace("<head>", "<head>" + head);
}

function show(value, address) {
  current = value;
  $("address").textContent = address || "";
  const text = value == null ? "" : String(value);
  $("view").srcdoc = buildDocument(text, $("remote").checked);
  $("status").textContent = text ? `${text.length.toLocaleString()} characters` : "Cell is empty";
}

async function readActiveCell() {
  const mine = ++seq;
  try {
    await Excel.run(async (context) => {
      const cell = context.workbook.getActiveCell();
      cell.load("values, address");
      await context.sync();
      if (mine === seq) show(cell.values[0][0], cell.address.replace(/^.*!/, ""));
    });
  } catch (e) {
    $("status").textContent = "Could not read cell: " + e.message;
  }
}

try { $("remote").checked = localStorage.getItem("remote") === "1"; } catch (e) {}
$("remote").addEventListener("change", () => {
  try { localStorage.setItem("remote", $("remote").checked ? "1" : "0"); } catch (e) {}
  show(current, $("address").textContent);
});

Office.onReady(({ host }) => {
  if (host !== Office.HostType.Excel) {
    // Opened in a plain browser: paste mode, handy for testing.
    $("paste").style.display = "block";
    $("refresh").style.display = "none";
    $("address").textContent = "Browser preview";
    $("paste").addEventListener("input", () => show($("paste").value, "Browser preview"));
    return;
  }
  $("refresh").addEventListener("click", readActiveCell);
  Office.context.document.addHandlerAsync(Office.EventType.DocumentSelectionChanged, readActiveCell);
  if (Office.context.requirements.isSetSupported("ExcelApi", "1.9")) {
    Excel.run(async (context) => {
      context.workbook.worksheets.onChanged.add(readActiveCell);
      await context.sync();
    }).catch(() => {});
  }
  readActiveCell();
});
</script>
</body>
</html>
